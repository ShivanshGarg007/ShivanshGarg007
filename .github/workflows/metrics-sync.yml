name: System Metrics Sync

on:
  schedule:
    # Runs once a day at 03:00 UTC; the job itself commits 1–5 times randomly
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Commit Internal States
        run: |
          git config user.name "ShivanshGarg007"
          git config user.email "shivanshgarg007@gmail.com"
          mkdir -p .github/data

          # Pick a random number of commits between 1 and 5
          NUM_COMMITS=$(( RANDOM % 5 + 1 ))
          echo "Committing $NUM_COMMITS time(s) today"

          for i in $(seq 1 "$NUM_COMMITS"); do
            sleep 2  # ensure unique timestamp each iteration
            echo "Last sync [$i/$NUM_COMMITS]: $(date -u)" > .github/data/sync.log
            git add .github/data/sync.log
            if ! git diff --cached --quiet; then
              git commit -m "chore: sync system metrics (${i}/${NUM_COMMITS})"
            fi
          done

          git pull --rebase
          git push
