<svg width="450" height="220" viewBox="0 0 450 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .terminal-window { fill: #0d1117; }
    .title-bar { fill: #161b22; }
    .text { font-family: 'Courier New', Courier, monospace; font-size: 14px; fill: #c9d1d9; }
    .keyword { fill: #ff7b72; }
    .string { fill: #a5d6ff; }
    .prompt { fill: #79c0ff; font-weight: bold; }
    .value { fill: #d2a8ff; }
    .accent { fill: #2f81f7; }
  </style>

  <!-- Window shadow & border -->
  <rect x="5" y="5" width="440" height="210" rx="10" ry="10" fill="#30363d" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.3))"/>
  <rect x="6" y="6" width="438" height="208" rx="9" ry="9" class="terminal-window"/>
  <path d="M6 15C6 10.029 10.029 6 15 6H435C439.971 6 444 10.029 444 15V30H6V15Z" class="title-bar"/>
  
  <circle cx="20" cy="18" r="5" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="5" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="5" fill="#27c93f"/>
  
  <text x="225" y="22" class="text" fill="#8b949e" text-anchor="middle" font-size="12">vansh@leetcode: ~</text>

  <g transform="translate(20, 60)">
    <text class="text">
      <tspan x="0" y="0" class="prompt">vansh@leetcode</tspan><tspan class="text">:</tspan><tspan class="accent">~</tspan><tspan class="text">$ ./show_stats.sh</tspan>
      
      <tspan x="0" dy="30" class="keyword">Ranking:       </tspan><tspan class="value">676874</tspan>
      <tspan x="0" dy="25" class="keyword">Rating:        </tspan><tspan class="value">N/A</tspan>
      <tspan x="0" dy="25" class="keyword">Problems Solved:</tspan><tspan class="value">234</tspan>
      <tspan x="0" dy="25" class="keyword">Difficulty:    </tspan><tspan class="string">116 Easy</tspan><tspan class="text"> / </tspan><tspan class="string">111 Med</tspan><tspan class="text"> / </tspan><tspan class="string">7 Hard</tspan>
      
      <tspan x="0" dy="30" class="prompt">vansh@leetcode</tspan><tspan class="text">:</tspan><tspan class="accent">~</tspan><tspan class="text">$ <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/>_</tspan>
    </text>
  </g>
</svg>
